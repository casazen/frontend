<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Inter, self-hosted (UI-01): the variable font of the redesign and of the public booking site, the same file
      `src/styles/public-fonts.css` declares. Preloaded so that the text does not swap fonts after the first paint. Vite
      gives it the hashed address of the build. `crossorigin` is required for fonts, even on the same origin.
    -->
    <link rel="preload" href="/src/assets/fonts/public/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>CasaZen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

name: E2E Tests

# L2 (demo) runs on every PR. Staging L3/GJ runs on push to develop when secrets exist.
# Local L3: backend/scripts/quality/run-l3-local.ps1

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A new push to a PR cancels the run of the commit it replaces; every other run has a group of its own.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The L2 suite split in three shards that run in parallel (one job was 13 minutes). The check
  # "E2E L2 (demo)" is the job below that waits for the three.
  e2e-l2-shard:
    name: E2E L2 (demo) shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No --with-deps: the ubuntu-latest image already has every library Chromium needs; --with-deps only added
      # fonts from the apt mirror, which at times took 10 minutes to download (~45 kB/s).
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run L2 demo suite (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-l2-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-l2:
    name: E2E L2 (demo)
    needs: e2e-l2-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e-l2-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::E2E L2 shards: $RESULT"
            exit 1
          fi

  e2e-staging:
    name: E2E staging smoke + GJ
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The `secrets` context is not allowed in `steps[*].if`: GitHub rejects the whole workflow
    # (runs fail with 0 jobs). Expose the secrets as job env and test `env.*` in the step conditions.
    env:
      E2E_AUTH0_EMAIL: ${{ secrets.E2E_AUTH0_EMAIL }}
      E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
      E2E_STAGING_API_URL: ${{ vars.E2E_STAGING_API_URL || 'https://casazen-api-test.up.railway.app/api' }}
      VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
      VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
      VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Check staging configuration and API readiness
        run: node scripts/check-staging.mjs

      - name: API regression smoke
        run: E2E_STAGING=1 npm run test:e2e -- --project=staging
        env:
          CI: true
          E2E_STAGING: '1'
          E2E_STAGING_API_URL: ${{ vars.E2E_STAGING_API_URL || 'https://casazen-api-test.up.railway.app/api' }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}

      - name: Golden Journey / L3 staging project
        run: E2E_STAGING=1 npm run test:e2e -- --project=staging-gj
        env:
          CI: true
          E2E_STAGING: '1'
          E2E_STAGING_API_URL: ${{ vars.E2E_STAGING_API_URL || 'https://casazen-api-test.up.railway.app/api' }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-staging-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

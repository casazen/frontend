name: E2E Tests

# E2E tests now run locally in Stage 03 (SDLC harness) — NOT in CI.
# See: backend/.claude/sdlc/03-development/harness.md
# Local workflow: backend/scripts/start-backend-local.ps1 + npm run test:e2e:local
#
# This workflow is intentionally a no-op so that any "E2E Tests" required
# status check in GitHub branch protection passes immediately.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: E2E skipped (runs locally in Stage 03)
        run: echo "E2E tests run locally via SDLC Stage 03 harness. See .claude/sdlc/03-development/harness.md"

  e2e-deploy-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: E2E deploy smoke skipped (runs locally in Stage 03)
        run: echo "E2E deploy smoke runs locally via SDLC Stage 03 harness."

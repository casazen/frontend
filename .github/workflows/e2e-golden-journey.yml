name: E2E Golden Journey

# No placeholder or `continue-on-error` gates here: a failing step fails the check.
# - The L2 (demo, page.route) shell checks are not repeated here: the whole L2 suite already runs in `e2e.yml`.
# - `GJ L3 (UI, ephemeral stack)`: the real Golden Journey from the UI against a real backend + PostgreSQL + mock
#   IdP/mail (admin, host, supplier, guest; F1-F2), Stripe test mode when the secrets exist (FN-03).
#   Runbook: backend docs/runbooks/golden-journey-l3.md.
# - Maestro host-app suite on an emulator: task FN-04 (mobile repo). Until then no app job runs here.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# A new push to a PR cancels the run of the commit it replaces; every other run has a group of its own.
concurrency:
  group: e2e-gj-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gj-l3:
    name: GJ L3 (UI, ephemeral stack)
    runs-on: ubuntu-24.04
    # The job takes 6-9 minutes; on 8 Nov every run hung for 32 minutes in the suite step and failed after 36: 15 minutes
    # is a margin over a slow run and bounds what a hang costs.
    timeout-minutes: 15
    # Throw-away service container: the password below is not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      E2E_BACKEND_DIR: ${{ github.workspace }}/backend
      E2E_BACKEND_NO_BUILD: '1'
      # Secrets are exposed as env and tested through env.*: the `secrets` context is not allowed in a step `if:`.
      BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
    steps:
      - name: Backend repository token present
        if: ${{ env.BACKEND_REPO_TOKEN == '' }}
        run: |
          echo "::error title=Golden Journey L3 cannot run::Secret BACKEND_REPO_TOKEN (read access to casazen/backend) is not set or not available to this run (fork PR?). This gate is NOT skipped silently: it fails. See backend docs/runbooks/golden-journey-l3.md section 3."
          exit 1
      - uses: actions/checkout@v4
        with:
          path: frontend
      - name: Pick the matching backend ref
        id: other
        env:
          OTHER_REPO: casazen/backend
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          # A matching backend branch is useful while a cross-repo change is in flight.
          # Once that exact head has merged into the base, use the base so the two repos stay current.
          ref="$BASE_REF"
          if [[ "$HEAD_REF" != "$BASE_REF" ]] && matched=$(git ls-remote --exit-code --heads "https://x-access-token:${BACKEND_REPO_TOKEN}@github.com/${OTHER_REPO}.git" "refs/heads/${HEAD_REF}" 2>/dev/null); then
            ref="$HEAD_REF"
            matched_sha=${matched%%[[:space:]]*}
            if prs=$(GH_TOKEN="$BACKEND_REPO_TOKEN" gh api --method GET "repos/${OTHER_REPO}/pulls" \
              -f state=all -f "head=${OTHER_REPO%%/*}:$HEAD_REF" -f "base=$BASE_REF" -F per_page=100); then
              if jq -e --arg sha "$matched_sha" '
                all(.[]; .state != "open") and
                any(.[]; .head.sha == $sha and .merged_at != null)
              ' <<<"$prs" >/dev/null; then
                ref="$BASE_REF"
              fi
            else
              echo "::warning::Could not inspect matching backend pull requests; using the matching branch."
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using ${OTHER_REPO} ref: $ref"
      - uses: actions/checkout@v4
        with:
          repository: casazen/backend
          ref: ${{ steps.other.outputs.ref }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Stripe CLI (only when the Stripe test secrets exist)
        if: ${{ env.STRIPE_TEST_SECRET_KEY != '' }}
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update && sudo apt-get install -y stripe
      - name: Install local document OCR tools
        # The contract of the round (CF-DOCS-REAL) is delivered as a scan, like the real one: the backend reads it with Tesseract (Italian and
        # English) after turning its pages into pictures with poppler, and runs them under prlimit (util-linux). The same step as the backend CI.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ita tesseract-ocr-eng poppler-utils
      - name: Build backend
        run: dotnet build backend/Casazen.Web -c Release
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          # No --with-deps: the ubuntu-latest image already has every library Chromium needs; --with-deps only added
          # fonts from the apt mirror, which at times took 10 minutes to download (~45 kB/s).
          npx playwright install chromium
      - name: Golden Journey L3 (stack up, suite, stack down)
        working-directory: frontend
        run: bash e2e/stack/ci-run.sh
      - name: Show the failed tests and the stack logs
        # Only on failure. The same files are uploaded as an artifact, but the job log is what is read first.
        if: ${{ failure() }}
        working-directory: frontend
        run: |
          strip() { sed 's/\x1b\[[0-9;]*[A-Za-z]//g'; }
          echo "::group::Failed tests (playwright-report.json)"
          if [ -f playwright-report.json ]; then
            jq -r '.. | objects | select(has("results")) | select(any(.results[]; .status=="failed" or .status=="timedOut")) | "### \(.projectName // "") \(.status // "")", (.results[-1].error.message // "no error message")' playwright-report.json 2>/dev/null | strip | head -150 || true
          else
            echo "no playwright-report.json: the suite did not run to the end"
          fi
          echo "::endgroup::"
          for f in e2e/.stack/*.log; do
            [ -f "$f" ] || continue
            echo "::group::Last 120 lines of $f"
            tail -n 120 "$f" | strip
            echo "::endgroup::"
          done
          ls -la e2e/.stack e2e/.auth 2>/dev/null || true
      - name: Upload logs and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gj-l3-logs
          if-no-files-found: ignore
          path: |
            frontend/e2e/.stack/*.log
            frontend/test-results/
            frontend/playwright-report.json
            frontend/e2e/.auth/gj-seed.json

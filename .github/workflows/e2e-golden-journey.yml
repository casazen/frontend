name: E2E Golden Journey

# No placeholder or `continue-on-error` gates here: a failing step fails the check.
# - `GJ web suite`: L2 (demo, page.route) shell checks, fast, not the journey gate.
# - `GJ L3 (UI, ephemeral stack)`: the real Golden Journey from the UI against a real backend + PostgreSQL + mock
#   IdP/mail (admin, host, supplier, guest; F1-F2), Stripe test mode when the secrets exist (FN-03).
#   Runbook: backend docs/runbooks/golden-journey-l3.md.
# - Maestro host-app suite on an emulator: task FN-04 (mobile repo). Until then no app job runs here.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  golden-journey-web:
    name: GJ web suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run golden-journey-web (L2 demo shell checks)
        run: npx playwright test e2e/golden-journey-web.spec.ts --project=chromium

  gj-l3:
    name: GJ L3 (UI, ephemeral stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Throw-away service container: the password below is not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      E2E_BACKEND_DIR: ${{ github.workspace }}/backend
      E2E_BACKEND_NO_BUILD: '1'
      # Secrets are exposed as env and tested through env.*: the `secrets` context is not allowed in a step `if:`.
      BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
    steps:
      - name: Backend repository token present
        if: ${{ env.BACKEND_REPO_TOKEN == '' }}
        run: |
          echo "::error title=Golden Journey L3 cannot run::Secret BACKEND_REPO_TOKEN (read access to casazen/backend) is not set or not available to this run (fork PR?). This gate is NOT skipped silently: it fails. See backend docs/runbooks/golden-journey-l3.md section 3."
          exit 1
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: casazen/backend
          # Same line of development as this run: the PR base branch (develop / main) or the pushed branch.
          ref: ${{ github.base_ref || github.ref_name }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Stripe CLI (only when the Stripe test secrets exist)
        if: ${{ env.STRIPE_TEST_SECRET_KEY != '' }}
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update && sudo apt-get install -y stripe
      - name: Build backend
        run: dotnet build backend/Casazen.Web -c Release
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Golden Journey L3 (stack up, suite, stack down)
        working-directory: frontend
        run: bash e2e/stack/ci-run.sh
      - name: Upload logs and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gj-l3-logs
          if-no-files-found: ignore
          path: |
            frontend/e2e/.stack/*.log
            frontend/test-results/
            frontend/playwright-report.json
            frontend/e2e/.auth/gj-seed.json

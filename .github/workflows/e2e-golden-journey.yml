name: E2E Golden Journey

# L2 (demo) Golden Journey web suite. No placeholder or `continue-on-error` gates here:
# a failing step fails the check.
# - Real Golden Journey L3 gate from the UI on an ephemeral stack (host, supplier, guest; F1–F2): task FN-03.
# - Maestro host-app suite on an emulator: task FN-04 (mobile repo). Until then no app job runs here.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  golden-journey-web:
    name: GJ web suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run golden-journey-web (L2 demo on PR)
        run: npx playwright test e2e/golden-journey-web.spec.ts --project=chromium
      # Skipped by the spec itself unless E2E_LOCAL=1 / E2E_STAGING=1 (real API); runs for real in FN-03.
      - name: Run supplier mobile F1–F2 file if present
        run: npx playwright test e2e/golden-journey-supplier-mobile.spec.ts --project=chromium

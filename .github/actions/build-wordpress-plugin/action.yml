name: Build the CasaZen WordPress plugin ZIP
description: >-
  Checks the version, builds the blocks, compiles the translations and writes integrations/wordpress/casazen/dist/casazen-<version>.zip.
  Used by the workflows "WordPress plugin" (the package job and plugin-check) and "WordPress plugin release". Needs the repository
  checked out first. It reads no secret and publishes nothing.

inputs:
  tag:
    description: >-
      The release tag (wp-plugin-v<version>) that the version of the plugin must match. Empty for a build that is not a release.
    required: false
    default: ''

outputs:
  version:
    description: The version of the plugin (the one string of the header, the constant and the Stable tag).
    value: ${{ steps.zip.outputs.version }}
  zip:
    description: The absolute path of the ZIP.
    value: ${{ steps.zip.outputs.zip }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: integrations/wordpress/casazen/package-lock.json

    # First of all, before anything is installed or built: a tag that is not wp-plugin-v<version> stops the run here.
    - name: Check the version
      shell: bash
      working-directory: integrations/wordpress/casazen
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if [ -n "$TAG" ]; then
          node tools/check-version.mjs --tag "$TAG"
        else
          node tools/check-version.mjs
        fi

    # PHP 8.3 and WP-CLI: only for `wp i18n`, which compiles the translations. The plugin itself is not run here.
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: wp-cli
        coverage: none

    # setup-php does not fail the job when it cannot install a tool: it only prints "Could not setup wp-cli" (the download from GitHub
    # failed, seen in a run of Plugin Check), and the step that compiles the translations then dies with "wp: command not found". So `wp`
    # is checked here and, when it is missing or does not run, installed by hand: two sources, three tries each. When WP-CLI still is not
    # there the step fails with a clear message: nothing is hidden.
    - name: Make sure WP-CLI is there
      shell: bash
      run: |
        if wp --version; then
          exit 0
        fi
        echo "::warning::WP-CLI is missing after setup-php (its download failed): installing it by hand."
        bin="$RUNNER_TEMP/wp-cli-bin"
        mkdir -p "$bin"
        for url in \
          'https://github.com/wp-cli/wp-cli/releases/latest/download/wp-cli.phar' \
          'https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar'; do
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 --output "$bin/wp" "$url" \
              && chmod +x "$bin/wp" \
              && "$bin/wp" --version; then
              echo "$bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "::warning::WP-CLI from $url, attempt $attempt of 3: it did not work."
            sleep 5
          done
        done
        echo "::error::WP-CLI is not available: setup-php could not install it and neither download worked."
        exit 1

    - name: Install the build tools
      shell: bash
      working-directory: integrations/wordpress/casazen
      run: npm ci

    - name: Build the blocks
      shell: bash
      working-directory: integrations/wordpress/casazen
      run: npm run build

    - name: Compile the translations
      shell: bash
      working-directory: integrations/wordpress/casazen
      run: |
        wp i18n make-mo languages
        wp i18n make-json languages --no-purge

    # Writes dist/casazen-<version>.zip, reads it back and checks it (one top-level folder, nothing that is not for the user).
    - name: Build the ZIP
      id: zip
      shell: bash
      working-directory: integrations/wordpress/casazen
      run: node tools/build-zip.mjs

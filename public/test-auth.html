<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth0 Token Debugger</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .section { margin: 20px 0; padding: 15px; background: #2d2d2d; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 3px; }
        button:hover { background: #005a9e; }
        pre { background: #1e1e1e; padding: 10px; border-radius: 3px; overflow-x: auto; }
        .error { color: #f48771; }
        .success { color: #89d185; }
        .warning { color: #dcdcaa; }
    </style>
</head>
<body>
    <h1>🔐 Auth0 Token Debugger</h1>
    
    <div class="section">
        <h2>Instructions</h2>
        <p>1. Make sure you're logged in to the main app (localhost:5173)</p>
        <p>2. Open browser console (F12)</p>
        <p>3. Click "Get Token from LocalStorage" to see what's stored</p>
        <p>4. Check if the token has the correct audience</p>
    </div>

    <div class="section">
        <h2>Actions</h2>
        <button onclick="checkLocalStorage()">Get Token from LocalStorage</button>
        <button onclick="testAPICall()">Test API Call with Token</button>
        <button onclick="clearConsole()">Clear Console</button>
    </div>

    <div class="section">
        <h2>Console Output</h2>
        <div id="output"></div>
    </div>

    <script>
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            const div = document.createElement('div');
            div.className = className;
            div.textContent = message;
            output.appendChild(div);
            console.log(message);
        }

        function clearConsole() {
            output.innerHTML = '';
        }

        function checkLocalStorage() {
            clearConsole();
            log('=== Checking LocalStorage for Auth0 tokens ===');
            
            const keys = Object.keys(localStorage);
            const auth0Keys = keys.filter(k => k.includes('auth0'));
            
            if (auth0Keys.length === 0) {
                log('❌ No Auth0 tokens found in localStorage', 'error');
                log('Make sure you\'re logged in!', 'warning');
                return;
            }

            auth0Keys.forEach(key => {
                log(`\n📦 Key: ${key}`);
                try {
                    const value = localStorage.getItem(key);
                    const parsed = JSON.parse(value);
                    
                    if (parsed.body && parsed.body.access_token) {
                        const token = parsed.body.access_token;
                        log(`✅ Found access token`, 'success');
                        
                        // Decode JWT
                        const parts = token.split('.');
                        if (parts.length === 3) {
                            const payload = JSON.parse(atob(parts[1]));
                            log(`\n📋 Token Details:`);
                            log(`  Audience: ${JSON.stringify(payload.aud)}`);
                            log(`  Issuer: ${payload.iss}`);
                            log(`  Subject: ${payload.sub}`);
                            log(`  Expires: ${new Date(payload.exp * 1000).toLocaleString()}`);
                            log(`  Scopes: ${payload.scope || 'none'}`);
                            
                            // Check audience
                            const expectedAudience = 'https://casazen-api';
                            const actualAudience = Array.isArray(payload.aud) ? payload.aud : [payload.aud];
                            
                            if (actualAudience.includes(expectedAudience)) {
                                log(`\n✅ Token has correct audience: ${expectedAudience}`, 'success');
                            } else {
                                log(`\n❌ PROBLEM: Token audience mismatch!`, 'error');
                                log(`  Expected: ${expectedAudience}`, 'error');
                                log(`  Got: ${JSON.stringify(actualAudience)}`, 'error');
                                log(`\n💡 Solution: You need to configure the API in Auth0 dashboard`, 'warning');
                            }

                            // Show first 50 chars of token
                            log(`\n🔑 Token (first 50 chars): ${token.substring(0, 50)}...`);
                        }
                    } else {
                        log(`  No access_token in this entry`);
                    }
                } catch (e) {
                    log(`  Error parsing: ${e.message}`, 'error');
                }
            });
        }

        async function testAPICall() {
            clearConsole();
            log('=== Testing API Call ===');
            
            // Find token
            const keys = Object.keys(localStorage);
            const auth0Keys = keys.filter(k => k.includes('auth0'));
            
            let token = null;
            for (const key of auth0Keys) {
                try {
                    const value = JSON.parse(localStorage.getItem(key));
                    if (value.body && value.body.access_token) {
                        token = value.body.access_token;
                        break;
                    }
                } catch (e) {}
            }

            if (!token) {
                log('❌ No token found. Please login first.', 'error');
                return;
            }

            log('🔄 Sending request to http://localhost:5000/api/properties');
            
            try {
                const response = await fetch('http://localhost:5000/api/properties', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                log(`\n📡 Response Status: ${response.status} ${response.statusText}`);
                
                if (response.status === 401) {
                    log('❌ Still getting 401 - Token is invalid or API not configured correctly', 'error');
                    const text = await response.text();
                    log(`Response body: ${text}`);
                } else if (response.status === 200) {
                    log('✅ Success! Authentication is working!', 'success');
                    const data = await response.json();
                    log(`Data: ${JSON.stringify(data, null, 2)}`);
                } else {
                    log(`⚠️  Unexpected status: ${response.status}`, 'warning');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>

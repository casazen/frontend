<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1f3a3d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inter (text) and Fraunces (headings), self-hosted: the files `src/styles/public-fonts.css` declares. Preloaded so that the
      headline does not swap fonts after the first paint. Vite gives them the hashed address of the build. `crossorigin` is
      required for fonts, even on the same origin.
    -->
    <link rel="preload" href="/src/assets/fonts/public/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/public/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!--site-head-->
  </head>
  <body>
    <!--site-root-->
    <script type="module" src="/src/site/entry-client.tsx"></script>
  </body>
</html>
